<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lavender Flowers</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg:#f3ecfa; --btn:#9b7bc9; --txt:#4b3a63; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); display: flex; flex-direction: column; font-family: "Helvetica Neue", Arial, sans-serif; }
  .bar { text-align: center; padding: 20px 16px 8px; }
  button { background: var(--btn); color: #fff; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 18px; cursor: pointer; box-shadow: 0 4px 12px rgba(155,123,201,.4); }
  button:active { transform: scale(.96); }
  .clear { background: transparent; color: var(--txt); box-shadow: none; font-size: 14px; padding: 8px 14px; }
  .hint { color: var(--txt); font-size: 13px; opacity: .7; margin-top: 6px; }
  #compliment { min-height: 48px; padding: 6px 20px; text-align: center; color: var(--txt); font-size: 18px; font-style: italic; transition: opacity .4s; }
  #compliment.hide { opacity: 0; }
  #garden { position: relative; flex: 1; overflow: hidden; }
  .flower { position: absolute; transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.3,1.5,.5,1) both; }
  @keyframes grow { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
  <div class="bar">
    <button id="add">Click here to add a flower 🌸</button>
    <div><button class="clear" id="clear">Clear</button></div>
    <div class="hint">You can also tap anywhere in the garden</div>
  </div>
  <div id="compliment" class="hide"></div>
  <div id="garden"></div>
<script>
  const garden = document.getElementById('garden');
  const shades = ['#b497d6', '#c3a9e3', '#a688cf', '#cdb8ea'];

  const compliments = [
    "You have a kind heart that makes everyone around you feel safe.",
    "Your smile can brighten even the gloomiest day.",
    "You work harder than anyone realizes, and it shows.",
    "You are more capable than you give yourself credit for.",
    "Your laugh is honestly contagious.",
    "You make ordinary moments feel special.",
    "You are a great listener, and people feel heard around you.",
    "Your patience is truly admirable.",
    "You have a beautiful way of seeing the good in people.",
    "You are braver than you think.",
    "Your presence makes any room feel warmer.",
    "You have a creative mind that never stops surprising me.",
    "You are the kind of person people are lucky to know.",
    "Your determination is inspiring.",
    "You handle hard days with so much grace.",
    "You have great taste in the little things.",
    "You are proof that gentle people are strong too.",
    "Your energy makes others want to do better.",
    "You are thoughtful in ways that don't go unnoticed.",
    "You have a way of making people feel like they matter.",
    "Your kindness leaves flowers wherever you go.",
    "You are growing beautifully, one day at a time.",
    "You are dependable, and that is a rare gift.",
    "Your voice has a calm that soothes everyone.",
    "You keep going even when it's tough, and that is amazing.",
    "You are genuinely one of a kind.",
    "Your heart is as soft and lovely as lavender.",
    "You deserve all the good things coming your way.",
    "You are smarter than you realize.",
    "I missed you."
  ];
  let pool = [], lastMsg = '', hideTimer;

  function nextCompliment() {
    if (!pool.length) {
      pool = compliments.slice().sort(() => Math.random() - 0.5);
      if (pool[pool.length - 1] === lastMsg) pool.unshift(pool.pop()); // avoid repeat right after reshuffle
    }
    lastMsg = pool.pop();
    return lastMsg;
  }

  function showCompliment() {
    const box = document.getElementById('compliment');
    box.textContent = nextCompliment();
    box.classList.remove('hide');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => box.classList.add('hide'), 5000);
  }

  function plant(x, y) {
    showCompliment();
    const size = 22 + Math.random() * 18;           // small flowers
    const color = shades[Math.floor(Math.random() * shades.length)];
    const petals = [0, 72, 144, 216, 288].map(a =>
      `<ellipse cx="20" cy="9" rx="5" ry="8" fill="${color}" transform="rotate(${a} 20 20)"/>`).join('');
    const el = document.createElement('div');
    el.className = 'flower';
    el.style.width = size + 'px';
    el.style.height = size * 2 + 'px';
    el.style.left = (x - size / 2) + 'px';
    el.style.top = (y - size * 2 + size / 2) + 'px';
    el.innerHTML = `<svg viewBox="0 0 40 80" width="100%" height="100%">
      <path d="M20 22 Q18 50 20 80" stroke="#7fa877" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M19 55 Q8 50 6 42 Q16 44 19 55Z" fill="#8fbb86"/>
      ${petals}
      <circle cx="20" cy="20" r="4" fill="#ffe08a"/>
    </svg>`;
    garden.appendChild(el);
  }

  document.getElementById('add').addEventListener('click', () => {
    const w = garden.clientWidth, h = garden.clientHeight;
    plant(20 + Math.random() * (w - 40), 60 + Math.random() * (h - 80));
  });
  garden.addEventListener('click', e => {
    const r = garden.getBoundingClientRect();
    plant(e.clientX - r.left, e.clientY - r.top + 20);
  });
  document.getElementById('clear').addEventListener('click', () => garden.innerHTML = '');
</script>
</body>
</html>
